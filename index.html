<!DOCTYPE html><html lang="en">
<head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#06122a">

<title>Kulzzy Radio Payment</title><script src="https://checkout.flutterwave.com/v3.js"></script><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#06122a;
    color:#fff;
    min-height:100vh;
}

.page{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:20px 15px 40px;
}

.header{
    text-align:center;
    padding:25px 10px 20px;
}

.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    border-radius:50%;
    margin-bottom:12px;
}

.header h1{
    font-size:30px;
    font-weight:900;
    color:#ffd400;
    margin-bottom:7px;
}

.header p{
    font-size:15px;
    color:#fff;
}

.card{
    background:#0b1d3a;
    border:1px solid rgba(255,212,0,.35);
    border-radius:18px;
    padding:22px 17px;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.title{
    text-align:center;
    color:#ffd400;
    font-size:24px;
    font-weight:900;
    margin-bottom:20px;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
    color:#fff;
}

input,
select{
    width:100%;
    height:52px;
    border:none;
    outline:none;
    border-radius:10px;
    padding:0 14px;
    margin-bottom:16px;
    background:#fff;
    color:#111;
    font-size:16px;
}

input:focus,
select:focus{
    box-shadow:0 0 0 3px rgba(255,212,0,.35);
}

.amount-box{
    position:relative;
}

.amount-box span{
    position:absolute;
    left:14px;
    top:16px;
    color:#555;
    font-weight:700;
}

.amount-box input{
    padding-left:42px;
}

.amount-note{
    font-size:12px;
    color:#bbb;
    margin-top:-9px;
    margin-bottom:16px;
}

.pay-button{
    width:100%;
    height:56px;
    border:none;
    border-radius:12px;
    background:#ffd400;
    color:#06122a;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    margin-top:5px;
}

.pay-button:active{
    transform:scale(.98);
}

.pay-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.notice{
    text-align:center;
    font-size:12px;
    line-height:1.5;
    color:#aaa;
    margin-top:18px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#ffd400;
    font-size:13px;
    font-weight:700;
}

.success{
    display:none;
    text-align:center;
    background:#0b1d3a;
    border:1px solid #ffd400;
    border-radius:18px;
    padding:30px 20px;
}

.success-icon{
    font-size:55px;
    margin-bottom:12px;
}

.success h2{
    color:#ffd400;
    margin-bottom:10px;
}

.success p{
    line-height:1.6;
    color:#ddd;
}

.ref{
    margin-top:15px;
    padding:12px;
    background:#06122a;
    border-radius:8px;
    color:#ffd400;
    word-break:break-all;
    font-weight:700;
}

.back-button{
    width:100%;
    height:48px;
    margin-top:18px;
    border:1px solid #ffd400;
    border-radius:10px;
    background:transparent;
    color:#ffd400;
    font-weight:800;
}

.hidden{
    display:none;
}

</style></head><body><div class="page"><div class="header">

    <!-- Replace this with your actual Kulzzy logo if needed -->
    <img
        class="logo"
        src="https://kulzzy.github.io/app/logo.jpg"
        alt="Kulzzy Radio">

    <h1>KULZZY RADIO</h1>

    <p>Celebrating Lives Everyday</p>

</div>


<div class="card" id="paymentCard">

    <div class="title">
        Make a Payment
    </div>


    <label for="name">
        Full Name
    </label>

    <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        autocomplete="name">


    <label for="email">
        Email Address
    </label>

    <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        autocomplete="email">


    <label for="phone">
        Phone Number
    </label>

    <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        autocomplete="tel">


    <label for="purpose">
        What are you paying for?
    </label>

    <select id="purpose">

        <option value="Celebration Announcement"
                data-amount="3000">
            Celebration Announcement — ₦3,000
        </option>

        <option value="Phone Call Interview"
                data-amount="7000">
            Phone Call Interview — ₦7,000
        </option>

        <option value="Business Publicity"
                data-amount="">
            Business Publicity — Enter Amount
        </option>

        <option value="Celebrate Me"
                data-amount="">
            Celebrate Me — Enter Amount
        </option>

        <option value="Sponsorship"
                data-amount="">
            Sponsorship — Enter Amount
        </option>

        <option value="Other"
                data-amount="">
            Other Payment — Enter Amount
        </option>

    </select>


    <label for="amount">
        Amount
    </label>

    <div class="amount-box">

        <span>₦</span>

        <input
            type="number"
            id="amount"
            min="1"
            step="1"
            placeholder="Enter amount">

    </div>

    <div class="amount-note">
        Enter the amount you want to pay.
    </div>


    <button
        class="pay-button"
        id="payButton"
        onclick="startPayment()">

        PAY NOW

    </button>


    <div class="notice">

        Your payment will be processed securely by
        Flutterwave.

    </div>

</div>


<div class="success" id="successBox">

    <div class="success-icon">
        ✓
    </div>

    <h2>
        Payment Submitted
    </h2>

    <p>
        Thank you for making a payment to Kulzzy Radio.
    </p>

    <div class="ref" id="transactionReference"></div>

    <button
        class="back-button"
        onclick="location.reload()">

        MAKE ANOTHER PAYMENT

    </button>

</div>


<div class="footer">
    STAY TUNED IN
</div>

</div><script>

/* =====================================================
   KULZZY RADIO FLUTTERWAVE SETTINGS
===================================================== */

const FLUTTERWAVE_PUBLIC_KEY =
    "YOUR_FLUTTERWAVE_PUBLIC_KEY";


/* =====================================================
   PAYMENT PURPOSE
===================================================== */

const purpose =
    document.getElementById("purpose");

const amount =
    document.getElementById("amount");


purpose.addEventListener("change", function(){

    const selected =
        this.options[this.selectedIndex];

    const fixedAmount =
        selected.getAttribute("data-amount");

    if(fixedAmount){

        amount.value = fixedAmount;

        amount.readOnly = true;

    }else{

        amount.value = "";

        amount.readOnly = false;

    }

});


/* =====================================================
   INITIAL AMOUNT
===================================================== */

window.addEventListener("load", function(){

    const selected =
        purpose.options[purpose.selectedIndex];

    const fixedAmount =
        selected.getAttribute("data-amount");

    if(fixedAmount){

        amount.value = fixedAmount;

        amount.readOnly = true;

    }

});


/* =====================================================
   START PAYMENT
===================================================== */

function startPayment(){

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const paymentPurpose =
        purpose.value;

    const paymentAmount =
        Number(amount.value);


    if(!name){

        alert("Please enter your full name.");

        return;

    }


    if(!email){

        alert("Please enter your email address.");

        return;

    }


    if(!phone){

        alert("Please enter your phone number.");

        return;

    }


    if(!paymentAmount || paymentAmount <= 0){

        alert("Please enter a valid payment amount.");

        return;

    }


    if(
        FLUTTERWAVE_PUBLIC_KEY ===
        "YOUR_FLUTTERWAVE_PUBLIC_KEY"
    ){

        alert(
            "Please add your Flutterwave Public Key first."
        );

        return;

    }


    const button =
        document.getElementById("payButton");

    button.disabled = true;

    button.innerText =
        "OPENING PAYMENT...";


    const txRef =
        "KULZZY-" +
        Date.now() +
        "-" +
        Math.floor(Math.random() * 100000);


    FlutterwaveCheckout({

        public_key:
            FLUTTERWAVE_PUBLIC_KEY,

        tx_ref:
            txRef,

        amount:
            paymentAmount,

        currency:
            "NGN",

        payment_options:
            "card,banktransfer,ussd,account,nqr,opay",

        customer: {

            email:
                email,

            phone_number:
                phone,

            name:
                name

        },

        meta: {

            payment_purpose:
                paymentPurpose,

            kulzzy_customer:
                name

        },

        customizations: {

            title:
                "Kulzzy Radio",

            description:
                paymentPurpose,

            logo:
                "https://kulzzy.github.io/app/logo.jpg"

        },

        callback:
            function(response){

                console.log(
                    "Flutterwave response:",
                    response
                );


                document.getElementById(
                    "paymentCard"
                ).style.display = "none";


                document.getElementById(
                    "successBox"
                ).style.display = "block";


                document.getElementById(
                    "transactionReference"
                ).innerText =
                    "Transaction Reference: " +
                    txRef;


                button.disabled = false;

                button.innerText =
                    "PAY NOW";

            },

        onclose:
            function(){

                button.disabled = false;

                button.innerText =
                    "PAY NOW";

            }

    });

}

</script>
</body>
</html>
