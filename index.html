<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#06122a">

<title>Kulzzy Radio Payment</title><script src="https://checkout.flutterwave.com/v3.js"></script><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#06122a;
    color:#fff;
    min-height:100vh;
}

.page{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:20px 15px 40px;
}

.header{
    text-align:center;
    padding:25px 10px 20px;
}

.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    border-radius:50%;
    margin-bottom:12px;
}

.header h1{
    font-size:30px;
    font-weight:900;
    color:#ffd400;
    margin-bottom:7px;
}

.header p{
    font-size:15px;
}

.card{
    background:#0b1d3a;
    border:1px solid rgba(255,212,0,.35);
    border-radius:18px;
    padding:22px 17px;
    box-shadow:0 8px 30px rgba(0,0,0,.3);
}

.title{
    text-align:center;
    color:#ffd400;
    font-size:24px;
    font-weight:900;
    margin-bottom:22px;
}

label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
}

select,
input{
    width:100%;
    height:54px;
    border:none;
    outline:none;
    border-radius:10px;
    padding:0 14px;
    margin-bottom:20px;
    background:#fff;
    color:#111;
    font-size:16px;
}

select:focus,
input:focus{
    box-shadow:0 0 0 3px rgba(255,212,0,.35);
}

.amount-box{
    position:relative;
}

.amount-box span{
    position:absolute;
    left:15px;
    top:17px;
    color:#555;
    font-weight:700;
}

.amount-box input{
    padding-left:40px;
}

.pay-button{
    width:100%;
    height:56px;
    border:none;
    border-radius:12px;
    background:#ffd400;
    color:#06122a;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
}

.pay-button:active{
    transform:scale(.98);
}

.pay-button:disabled{
    opacity:.6;
}

.notice{
    text-align:center;
    font-size:12px;
    line-height:1.5;
    color:#aaa;
    margin-top:18px;
}

.footer{
    text-align:center;
    margin-top:25px;
    color:#ffd400;
    font-size:13px;
    font-weight:700;
}

.success{
    display:none;
    text-align:center;
    background:#0b1d3a;
    border:1px solid #ffd400;
    border-radius:18px;
    padding:30px 20px;
}

.success-icon{
    width:60px;
    height:60px;
    line-height:60px;
    margin:0 auto 15px;
    border-radius:50%;
    background:#ffd400;
    color:#06122a;
    font-size:35px;
    font-weight:900;
}

.success h2{
    color:#ffd400;
    margin-bottom:10px;
}

.success p{
    line-height:1.6;
    color:#ddd;
}

.ref{
    margin-top:15px;
    padding:12px;
    background:#06122a;
    border-radius:8px;
    color:#ffd400;
    word-break:break-all;
    font-weight:700;
}

.back-button{
    width:100%;
    height:48px;
    margin-top:18px;
    border:1px solid #ffd400;
    border-radius:10px;
    background:transparent;
    color:#ffd400;
    font-weight:800;
}

</style></head><body><div class="page"><div class="header">

    <img
        class="logo"
        src="https://kulzzy.github.io/app/logo.jpg"
        alt="Kulzzy Radio">

    <h1>
        KULZZY RADIO
    </h1>

    <p>
        Celebrating Lives Everyday
    </p>

</div>


<div class="card" id="paymentCard">

    <div class="title">
        Make a Payment
    </div>


    <label for="purpose">
        Payment Purpose
    </label>

    <select id="purpose">

        <option
            value="Celebration Announcement"
            data-amount="3000">

            Celebration Announcement — ₦3,000

        </option>

        <option
            value="Phone Call Interview"
            data-amount="7000">

            Phone Call Interview — ₦7,000

        </option>

        <option
            value="Business Publicity"
            data-amount="">

            Business Publicity

        </option>

        <option
            value="Celebrate Me"
            data-amount="">

            Celebrate Me

        </option>

        <option
            value="Sponsorship"
            data-amount="">

            Sponsorship

        </option>

        <option
            value="Other"
            data-amount="">

            Other Payment

        </option>

    </select>


    <label for="amount">
        Amount
    </label>

    <div class="amount-box">

        <span>₦</span>

        <input
            type="number"
            id="amount"
            min="1"
            step="1"
            placeholder="Enter amount">

    </div>


    <button
        class="pay-button"
        id="payButton"
        onclick="startPayment()">

        PAY NOW

    </button>


    <div class="notice">

        You will enter your payment details securely
        through Flutterwave.

    </div>

</div>


<div class="success" id="successBox">

    <div class="success-icon">
        ✓
    </div>

    <h2>
        Payment Submitted
    </h2>

    <p>
        Thank you for making a payment to
        Kulzzy Radio.
    </p>

    <div
        class="ref"
        id="transactionReference">
    </div>

    <button
        class="back-button"
        onclick="location.reload()">

        MAKE ANOTHER PAYMENT

    </button>

</div>


<div class="footer">
    STAY TUNED IN
</div>

</div><script>

/* =====================================================
   KULZZY RADIO FLUTTERWAVE PUBLIC KEY
===================================================== */

const FLUTTERWAVE_PUBLIC_KEY =
    "FLWPUBK-5307a6454182615bb0f9ef448799d87d-X";


/* =====================================================
   ELEMENTS
===================================================== */

const purpose =
    document.getElementById("purpose");

const amount =
    document.getElementById("amount");


/* =====================================================
   PURPOSE CHANGE
===================================================== */

purpose.addEventListener(
    "change",
    function(){

        const selected =
            this.options[this.selectedIndex];

        const fixedAmount =
            selected.getAttribute(
                "data-amount"
            );

        if(fixedAmount){

            amount.value =
                fixedAmount;

            amount.readOnly =
                true;

        }else{

            amount.value =
                "";

            amount.readOnly =
                false;

        }

    }
);


/* =====================================================
   INITIAL AMOUNT
===================================================== */

window.addEventListener(
    "load",
    function(){

        const selected =
            purpose.options[
                purpose.selectedIndex
            ];

        const fixedAmount =
            selected.getAttribute(
                "data-amount"
            );

        if(fixedAmount){

            amount.value =
                fixedAmount;

            amount.readOnly =
                true;

        }

    }
);


/* =====================================================
   START PAYMENT
===================================================== */

function startPayment(){

    const paymentPurpose =
        purpose.value;

    const paymentAmount =
        Number(amount.value);


    if(
        !paymentAmount ||
        paymentAmount <= 0
    ){

        alert(
            "Please enter a valid amount."
        );

        return;

    }


    const button =
        document.getElementById(
            "payButton"
        );

    button.disabled =
        true;

    button.innerText =
        "OPENING PAYMENT...";


    const txRef =
        "KULZZY-" +
        Date.now() +
        "-" +
        Math.floor(
            Math.random() * 100000
        );


    FlutterwaveCheckout({

        public_key:
            FLUTTERWAVE_PUBLIC_KEY,

        tx_ref:
            txRef,

        amount:
            paymentAmount,

        currency:
            "NGN",

        payment_options:
            "card,banktransfer,ussd,account,nqr,opay",

        customer: {

            /*
             * Flutterwave collects
             * the customer details.
             */

        },

        meta: {

            payment_purpose:
                paymentPurpose

        },

        customizations: {

            title:
                "Kulzzy Radio",

            description:
                paymentPurpose,

            logo:
                "https://kulzzy.github.io/app/logo.jpg"

        },

        callback:
            function(response){

                console.log(
                    "Flutterwave Response:",
                    response
                );

                document.getElementById(
                    "paymentCard"
                ).style.display =
                    "none";

                document.getElementById(
                    "successBox"
                ).style.display =
                    "block";

                document.getElementById(
                    "transactionReference"
                ).innerText =
                    "Transaction Reference: " +
                    txRef;

            },

        onclose:
            function(){

                button.disabled =
                    false;

                button.innerText =
                    "PAY NOW";

            }

    });

}

</script>
</body>
</html>
